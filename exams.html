<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exams - Exam Management</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
    nav {
      background: #1e3a5f; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    nav .logo { color: #fff; font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    nav ul { list-style: none; display: flex; gap: 0.5rem; }
    nav ul li a {
      color: #a0b4cc; text-decoration: none;
      padding: 0.4rem 0.9rem; border-radius: 5px; font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
    }
    nav ul li a:hover, nav ul li a.active { background: #2d6aad; color: #fff; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.6rem; color: #1e3a5f; }
    .page-header span { font-size: 0.9rem; color: #718096; }

    .btn { padding: 0.55rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #2d6aad; color: #fff; }
    .btn-danger  { background: #e53e3e; color: #fff; font-size: 0.8rem; padding: 0.35rem 0.8rem; }
    .btn-secondary { background: #e2e8f0; color: #4a5568; }

    .toolbar { display: flex; gap: 1rem; margin-bottom: 1.2rem; align-items: center; }
    .toolbar input, .toolbar select {
      padding: 0.55rem 1rem; border: 1px solid #cbd5e0;
      border-radius: 6px; font-size: 0.9rem; background: #fff;
    }
    .toolbar input { flex: 1; }
    .toolbar input:focus, .toolbar select:focus { outline: none; border-color: #2d6aad; }

    .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #1e3a5f; color: #fff; }
    thead th { padding: 0.85rem 1rem; text-align: left; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; }
    tbody tr { border-bottom: 1px solid #e2e8f0; transition: background 0.15s; }
    tbody tr:hover { background: #ebf4ff; }
    tbody td { padding: 0.8rem 1rem; font-size: 0.9rem; }

    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-upcoming  { background: #bee3f8; color: #2c5282; }
    .badge-ongoing   { background: #c6f6d5; color: #276749; }
    .badge-completed { background: #e2e8f0; color: #4a5568; }

    .actions { display: flex; gap: 0.4rem; }
    .empty-row td { text-align: center; padding: 2rem; color: #a0aec0; font-size: 0.9rem; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 500px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 1.2rem; color: #1e3a5f; margin-bottom: 1.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.3rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.55rem 0.9rem; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #2d6aad; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem; }
  </style>
</head>
<body>

<nav>
  <div class="logo">📚 ExamMS</div>
  <ul>
    <li><a href="../index.html">Dashboard</a></li>
    <li><a href="students.html">Students</a></li>
    <li><a href="exams.html" class="active">Exams</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="schedule.html">Schedule</a></li>
  </ul>
</nav>

<main>
  <div class="page-header">
    <div>
      <h1>Exams</h1>
      <span id="examCount">Loading...</span>
    </div>
    <button class="btn btn-primary" onclick="openModal('addModal')">+ Schedule Exam</button>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍  Search by subject or hall..." oninput="filterExams()" />
    <select id="filterStatus" onchange="filterExams()">
      <option value="">All Status</option>
      <option value="Upcoming">Upcoming</option>
      <option value="Ongoing">Ongoing</option>
      <option value="Completed">Completed</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Subject</th>
          <th>Department</th>
          <th>Date</th>
          <th>Time</th>
          <th>Duration</th>
          <th>Hall / Room</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="examTable">
        <tr class="empty-row"><td colspan="9">No exams scheduled yet.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Add Exam Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Schedule New Exam</h2>
    <div class="form-group">
      <label>Subject Name</label>
      <input type="text" id="subject" placeholder="e.g. Data Structures" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Department</label>
        <select id="dept">
          <option value="">Select Dept.</option>
          <option>Computer Science</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Mathematics</option>
        </select>
      </div>
      <div class="form-group">
        <label>Hall / Room</label>
        <input type="text" id="hall" placeholder="e.g. Hall A" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="examDate" />
      </div>
      <div class="form-group">
        <label>Start Time</label>
        <input type="time" id="examTime" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Duration</label>
        <select id="duration">
          <option value="1 Hour">1 Hour</option>
          <option value="1.5 Hours">1.5 Hours</option>
          <option value="2 Hours" selected>2 Hours</option>
          <option value="3 Hours">3 Hours</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="examStatus">
          <option value="Upcoming">Upcoming</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addExam()">Schedule Exam</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let exams = JSON.parse(localStorage.getItem('exams') || '[]');
  function saveExams() { localStorage.setItem('exams', JSON.stringify(exams)); }

  function renderTable(data) {
    const tbody = document.getElementById('examTable');
    document.getElementById('examCount').textContent = `${exams.length} exam${exams.length !== 1 ? 's' : ''} total`;
    if (data.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="9">No exams found.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map((e, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${e.subject}</strong></td>
        <td>${e.dept}</td>
        <td>${e.examDate}</td>
        <td>${e.examTime}</td>
        <td>${e.duration}</td>
        <td>${e.hall}</td>
        <td><span class="badge badge-${e.examStatus.toLowerCase()}">${e.examStatus}</span></td>
        <td class="actions">
          <button class="btn btn-danger" onclick="deleteExam(${exams.indexOf(e)})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function filterExams() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const st = document.getElementById('filterStatus').value;
    const filtered = exams.filter(e =>
      (e.subject.toLowerCase().includes(q) || e.hall.toLowerCase().includes(q)) &&
      (st === '' || e.examStatus === st)
    );
    renderTable(filtered);
  }

  function addExam() {
    const subject = document.getElementById('subject').value.trim();
    const dept = document.getElementById('dept').value;
    const hall = document.getElementById('hall').value.trim();
    const examDate = document.getElementById('examDate').value;
    const examTime = document.getElementById('examTime').value;
    const duration = document.getElementById('duration').value;
    const examStatus = document.getElementById('examStatus').value;
    if (!subject || !dept || !hall || !examDate || !examTime) { alert('Please fill in all fields.'); return; }
    exams.push({ subject, dept, hall, examDate, examTime, duration, examStatus });
    saveExams();
    renderTable(exams);
    closeModal('addModal');
    document.getElementById('subject').value = '';
    document.getElementById('hall').value = '';
  }

  function deleteExam(i) {
    if (confirm('Remove this exam?')) { exams.splice(i, 1); saveExams(); renderTable(exams); }
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  renderTable(exams);
</script>
</body>
</html>
