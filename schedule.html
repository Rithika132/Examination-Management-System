<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule - Exam Management</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
    nav {
      background: #1e3a5f; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    nav .logo { color: #fff; font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    nav ul { list-style: none; display: flex; gap: 0.5rem; }
    nav ul li a {
      color: #a0b4cc; text-decoration: none;
      padding: 0.4rem 0.9rem; border-radius: 5px; font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
    }
    nav ul li a:hover, nav ul li a.active { background: #2d6aad; color: #fff; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.6rem; color: #1e3a5f; }
    .page-header span { font-size: 0.9rem; color: #718096; }

    .btn { padding: 0.55rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #2d6aad; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #4a5568; }
    .btn-sm { font-size: 0.78rem; padding: 0.3rem 0.7rem; }

    /* MONTH NAV */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border-radius: 10px; padding: 1rem 1.5rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 1.5rem;
    }
    .month-nav h2 { font-size: 1.2rem; color: #1e3a5f; font-weight: 700; }
    .month-nav .nav-btns { display: flex; gap: 0.5rem; }

    /* CALENDAR GRID */
    .calendar { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 1.5rem; }
    .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); background: #1e3a5f; }
    .cal-head div { color: #a0b4cc; font-size: 0.8rem; font-weight: 600; text-align: center; padding: 0.7rem 0; letter-spacing: 0.5px; }
    .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid #e2e8f0; }
    .cal-day {
      min-height: 80px; padding: 0.5rem; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;
      position: relative; transition: background 0.15s;
    }
    .cal-day:hover { background: #f7fafc; }
    .cal-day.empty { background: #fafafa; }
    .cal-day.today { background: #ebf4ff; }
    .day-num { font-size: 0.8rem; font-weight: 600; color: #4a5568; margin-bottom: 0.3rem; }
    .cal-day.today .day-num { background: #2d6aad; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
    .exam-pill {
      background: #bee3f8; color: #2c5282;
      font-size: 0.7rem; font-weight: 600;
      padding: 0.15rem 0.4rem; border-radius: 4px;
      margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    .exam-pill.completed { background: #e2e8f0; color: #718096; }
    .exam-pill.ongoing { background: #c6f6d5; color: #276749; }

    /* UPCOMING LIST */
    .section-title { font-size: 1rem; font-weight: 700; color: #1e3a5f; margin-bottom: 1rem; }
    .exam-list { display: flex; flex-direction: column; gap: 0.7rem; }
    .exam-item {
      background: #fff; border-radius: 10px; padding: 1rem 1.2rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 1.2rem;
      border-left: 4px solid #2d6aad;
    }
    .exam-item.completed { border-color: #a0aec0; }
    .exam-item.ongoing   { border-color: #38a169; }
    .exam-date-box {
      background: #ebf4ff; color: #2c5282;
      border-radius: 8px; padding: 0.5rem 0.8rem;
      text-align: center; min-width: 52px;
    }
    .exam-date-box .day  { font-size: 1.4rem; font-weight: 800; line-height: 1; }
    .exam-date-box .mon  { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .exam-info { flex: 1; }
    .exam-info .title { font-size: 0.95rem; font-weight: 700; color: #1a202c; }
    .exam-info .meta  { font-size: 0.8rem; color: #718096; margin-top: 0.2rem; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-upcoming  { background: #bee3f8; color: #2c5282; }
    .badge-ongoing   { background: #c6f6d5; color: #276749; }
    .badge-completed { background: #e2e8f0; color: #4a5568; }

    .empty-state { text-align: center; padding: 3rem; color: #a0aec0; }
    .empty-state p { font-size: 1rem; }
    .empty-state a { color: #2d6aad; text-decoration: none; font-weight: 600; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 1.1rem; color: #1e3a5f; margin-bottom: 0.8rem; }
    .modal-detail { font-size: 0.9rem; color: #4a5568; line-height: 1.8; }
    .modal-detail strong { color: #1a202c; }
    .modal-footer { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
  </style>
</head>
<body>

<nav>
  <div class="logo">📚 ExamMS</div>
  <ul>
    <li><a href="../index.html">Dashboard</a></li>
    <li><a href="students.html">Students</a></li>
    <li><a href="exams.html">Exams</a></li>
    <li><a href="results.html">Results</a></li>
    <li><a href="schedule.html" class="active">Schedule</a></li>
  </ul>
</nav>

<main>
  <div class="page-header">
    <div>
      <h1>Exam Schedule</h1>
      <span id="scheduleInfo">Calendar view of all scheduled exams</span>
    </div>
    <a href="exams.html" class="btn btn-primary">+ Schedule Exam</a>
  </div>

  <!-- Month Navigation -->
  <div class="month-nav">
    <div class="nav-btns">
      <button class="btn btn-secondary btn-sm" onclick="changeMonth(-1)">&#8592; Prev</button>
      <button class="btn btn-secondary btn-sm" onclick="goToday()">Today</button>
      <button class="btn btn-secondary btn-sm" onclick="changeMonth(1)">Next &#8594;</button>
    </div>
    <h2 id="monthTitle"></h2>
    <div style="width:120px"></div>
  </div>

  <!-- Calendar -->
  <div class="calendar">
    <div class="cal-head">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="cal-body" id="calBody"></div>
  </div>

  <!-- Upcoming Exams List -->
  <div class="section-title" id="listTitle">All Exams</div>
  <div class="exam-list" id="examList"></div>
</main>

<!-- Exam Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2 id="modalSubject"></h2>
    <div class="modal-detail" id="modalDetail"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('detailModal')">Close</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let currentDate = new Date();
  let viewYear = currentDate.getFullYear();
  let viewMonth = currentDate.getMonth();

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function getExams() { return JSON.parse(localStorage.getItem('exams') || '[]'); }

  function changeMonth(dir) { viewMonth += dir; if (viewMonth > 11) { viewMonth = 0; viewYear++; } if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); }
  function goToday() { viewYear = currentDate.getFullYear(); viewMonth = currentDate.getMonth(); render(); }

  function render() {
    document.getElementById('monthTitle').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    renderCalendar();
    renderList();
  }

  function renderCalendar() {
    const body = document.getElementById('calBody');
    const exams = getExams();
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = currentDate;

    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === d;
      const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayExams = exams.filter(e => e.examDate === dateStr);
      html += `<div class="cal-day${isToday ? ' today' : ''}">
        <div class="day-num">${isToday ? `<span>${d}</span>` : d}</div>
        ${dayExams.map(e => `<div class="exam-pill ${e.examStatus.toLowerCase()}" onclick="showDetail(${JSON.stringify(e).replace(/"/g,'&quot;')})" title="${e.subject}">${e.examTime ? e.examTime + ' ' : ''}${e.subject}</div>`).join('')}
      </div>`;
    }
    const remaining = (firstDay + daysInMonth) % 7;
    if (remaining !== 0) for (let i = 0; i < 7 - remaining; i++) html += '<div class="cal-day empty"></div>';
    body.innerHTML = html;
  }

  function renderList() {
    const exams = getExams();
    const list = document.getElementById('examList');
    if (exams.length === 0) {
      list.innerHTML = `<div class="empty-state"><p>No exams scheduled yet. <a href="exams.html">Schedule one now →</a></p></div>`;
      document.getElementById('listTitle').textContent = 'All Exams';
      return;
    }
    const sorted = [...exams].sort((a, b) => new Date(a.examDate) - new Date(b.examDate));
    document.getElementById('listTitle').textContent = `All Exams (${exams.length})`;
    list.innerHTML = sorted.map(e => {
      const d = new Date(e.examDate + 'T00:00:00');
      const day = d.getDate();
      const mon = MONTHS[d.getMonth()].slice(0, 3).toUpperCase();
      return `<div class="exam-item ${e.examStatus.toLowerCase()}">
        <div class="exam-date-box">
          <div class="day">${day}</div>
          <div class="mon">${mon}</div>
        </div>
        <div class="exam-info">
          <div class="title">${e.subject}</div>
          <div class="meta">🕐 ${e.examTime || 'TBD'} &nbsp;·&nbsp; ⏱ ${e.duration} &nbsp;·&nbsp; 🏛 ${e.hall} &nbsp;·&nbsp; 📚 ${e.dept}</div>
        </div>
        <span class="badge badge-${e.examStatus.toLowerCase()}">${e.examStatus}</span>
      </div>`;
    }).join('');
  }

  function showDetail(e) {
    document.getElementById('modalSubject').textContent = e.subject;
    document.getElementById('modalDetail').innerHTML = `
      <strong>Department:</strong> ${e.dept}<br>
      <strong>Date:</strong> ${e.examDate}<br>
      <strong>Time:</strong> ${e.examTime || 'TBD'}<br>
      <strong>Duration:</strong> ${e.duration}<br>
      <strong>Hall / Room:</strong> ${e.hall}<br>
      <strong>Status:</strong> ${e.examStatus}
    `;
    openModal('detailModal');
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  render();
</script>
</body>
</html>
